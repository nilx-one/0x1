name: Documentation CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-policy:
    name: Documentation policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate protocol-only repository boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          unexpected=()
          while IFS= read -r entry; do
            case "$entry" in
              .git|.github|contracts|documents|scripts|tests|.gitignore|.gitattributes|*.md)
                ;;
              *)
                unexpected+=("$entry")
                ;;
            esac
          done < <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          if ((${#unexpected[@]})); then
            printf 'Protocol repository contains implementation-owned top-level entries:\n' >&2
            printf '  %s\n' "${unexpected[@]}" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test linter contracts
        run: python -m unittest tests/test_documentation_linter.py

      - name: Validate documentation foundation and policy
        run: python scripts/lint_documentation.py
