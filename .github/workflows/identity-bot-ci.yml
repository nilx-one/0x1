name: Identity Bot CI

on:
  pull_request:
    paths:
      - "identity-bot/**"
      - ".github/workflows/identity-bot-ci.yml"
      - "documents/04-identity.md"
  push:
    branches:
      - master
    paths:
      - "identity-bot/**"
      - ".github/workflows/identity-bot-ci.yml"
      - "documents/04-identity.md"

permissions:
  contents: read

jobs:
  full-ci:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path identity-bot/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path identity-bot/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path identity-bot/Cargo.toml --all-features
